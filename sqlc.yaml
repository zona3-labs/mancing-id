version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/"
    queries: "internal/category/query/"
    gen:
      go:
        package: "db"
        out: "internal/category/db"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - column: "categories.deleted_at"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
  - engine: "postgresql"
    schema: "migrations/"
    queries: "internal/brand/query/"
    gen:
      go:
        package: "db"
        out: "internal/brand/db"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - column: "brands.deleted_at"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - column: "brands.logo_path"
            go_type:
              type: "string"
              pointer: true
  - engine: "postgresql"
    schema: "migrations/"
    queries: "internal/product/query/"
    gen:
      go:
        package: "db"
        out: "internal/product/db"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - column: "products.deleted_at"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - column: "products.description"
            go_type:
              type: "string"
              pointer: true
          - column: "products.short_description"
            go_type:
              type: "string"
              pointer: true
          - column: "products.brand_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true