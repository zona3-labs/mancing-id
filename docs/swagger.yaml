basePath: /api/v1
definitions:
  brand.Brand:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      logo_path:
        type: string
      name:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  brand.createBrandRequest:
    properties:
      logo_path:
        type: string
      name:
        type: string
      slug:
        type: string
    required:
    - name
    type: object
  brand.updateBrandRequest:
    properties:
      is_active:
        type: boolean
      logo_path:
        type: string
      name:
        type: string
      slug:
        type: string
    required:
    - name
    type: object
  category.Category:
    properties:
      children:
        items:
          $ref: '#/definitions/category.Category'
        type: array
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      parent_id:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  category.createCategoryRequest:
    properties:
      name:
        type: string
      parent_id:
        type: string
      slug:
        type: string
    required:
    - name
    type: object
  category.updateCategoryRequest:
    properties:
      is_active:
        type: boolean
      name:
        type: string
      parent_id:
        type: string
      slug:
        type: string
    required:
    - name
    type: object
  product.Product:
    properties:
      brand_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_feature:
        type: boolean
      name:
        type: string
      short_description:
        type: string
      slug:
        type: string
      status:
        $ref: '#/definitions/product.ProductStatus'
      updated_at:
        type: string
    type: object
  product.ProductDetail:
    properties:
      brand_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: string
      images:
        items:
          $ref: '#/definitions/product.ProductImage'
        type: array
      is_feature:
        type: boolean
      name:
        type: string
      options:
        items:
          $ref: '#/definitions/product.ProductOptionWithValues'
        type: array
      short_description:
        type: string
      slug:
        type: string
      status:
        $ref: '#/definitions/product.ProductStatus'
      updated_at:
        type: string
      variants:
        items:
          $ref: '#/definitions/product.ProductVariantDetail'
        type: array
    type: object
  product.ProductImage:
    properties:
      alt_text:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_primary:
        type: boolean
      position:
        type: integer
      product_id:
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  product.ProductOption:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      position:
        type: integer
      product_id:
        type: string
      updated_at:
        type: string
    type: object
  product.ProductOptionValue:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      position:
        type: integer
      product_option_id:
        type: string
      updated_at:
        type: string
      value:
        type: string
    type: object
  product.ProductOptionWithValues:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      position:
        type: integer
      product_id:
        type: string
      updated_at:
        type: string
      values:
        items:
          $ref: '#/definitions/product.ProductOptionValue'
        type: array
    type: object
  product.ProductStatus:
    enum:
    - draft
    - active
    - archived
    type: string
    x-enum-varnames:
    - StatusDraft
    - StatusActive
    - StatusArchived
  product.ProductVariant:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      image_id:
        type: string
      price:
        type: string
      product_id:
        type: string
      sku:
        type: string
      status:
        $ref: '#/definitions/product.VariantStatus'
      stock:
        type: integer
      updated_at:
        type: string
      weight:
        type: string
    type: object
  product.ProductVariantDetail:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      image_id:
        type: string
      option_values:
        items:
          $ref: '#/definitions/product.ProductOptionValue'
        type: array
      price:
        type: string
      product_id:
        type: string
      sku:
        type: string
      status:
        $ref: '#/definitions/product.VariantStatus'
      stock:
        type: integer
      updated_at:
        type: string
      weight:
        type: string
    type: object
  product.VariantStatus:
    enum:
    - draft
    - active
    - archived
    type: string
    x-enum-varnames:
    - VariantStatusDraft
    - VariantStatusActive
    - VariantStatusArchived
  product.createProductImageRequest:
    properties:
      alt_text:
        type: string
      is_primary:
        type: boolean
      position:
        type: integer
      url:
        type: string
    required:
    - url
    type: object
  product.createProductOptionRequest:
    properties:
      is_active:
        type: boolean
      name:
        type: string
      position:
        type: integer
      values:
        items:
          $ref: '#/definitions/product.createProductOptionValueInOptionRequest'
        type: array
    required:
    - name
    type: object
  product.createProductOptionValueInOptionRequest:
    properties:
      is_active:
        type: boolean
      position:
        type: integer
      value:
        type: string
    required:
    - value
    type: object
  product.createProductOptionValueRequest:
    properties:
      is_active:
        type: boolean
      position:
        type: integer
      value:
        type: string
    required:
    - value
    type: object
  product.createProductRequest:
    properties:
      brand_id:
        type: string
      description:
        type: string
      is_feature:
        type: boolean
      name:
        type: string
      short_description:
        type: string
      slug:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/product.ProductStatus'
        enum:
        - draft
        - active
        - archived
    required:
    - name
    - status
    type: object
  product.createProductVariantRequest:
    properties:
      image_id:
        type: string
      option_value_ids:
        items:
          type: string
        type: array
      price:
        type: string
      sku:
        type: string
      status:
        $ref: '#/definitions/product.VariantStatus'
      stock:
        type: integer
      weight:
        type: string
    required:
    - price
    - sku
    - status
    type: object
  product.updateProductOptionRequest:
    properties:
      is_active:
        type: boolean
      name:
        type: string
      position:
        type: integer
    required:
    - name
    type: object
  product.updateProductRequest:
    properties:
      brand_id:
        type: string
      description:
        type: string
      is_feature:
        type: boolean
      name:
        type: string
      short_description:
        type: string
      slug:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/product.ProductStatus'
        enum:
        - draft
        - active
        - archived
    required:
    - name
    - status
    type: object
  product.updateProductVariantRequest:
    properties:
      image_id:
        type: string
      price:
        type: string
      sku:
        type: string
      status:
        $ref: '#/definitions/product.VariantStatus'
      stock:
        type: integer
      weight:
        type: string
    required:
    - price
    - sku
    - status
    type: object
  response.Envelope:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      request_id:
        type: string
      success:
        example: true
        type: boolean
    type: object
  response.ErrorEnvelope:
    properties:
      error:
        type: string
      request_id:
        type: string
      success:
        example: false
        type: boolean
    type: object
info:
  contact: {}
  description: This is the API server for Mancing ID.
  title: Mancing ID API
  version: "1.0"
paths:
  /brands:
    get:
      description: Retrieve all registered brands
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/brand.Brand'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Get all brands
      tags:
      - brands
    post:
      consumes:
      - application/json
      description: Create a new brand with name, slug, and logo path
      parameters:
      - description: Brand details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/brand.createBrandRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/brand.Brand'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Create a new brand
      tags:
      - brands
  /brands/{id}:
    delete:
      description: Soft delete an existing brand by its ID
      parameters:
      - description: Brand ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Delete a brand
      tags:
      - brands
    put:
      consumes:
      - application/json
      description: Update details of an existing brand by its ID
      parameters:
      - description: Brand ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Updated brand details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/brand.updateBrandRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/brand.Brand'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Update a brand
      tags:
      - brands
  /brands/{id}/logo:
    post:
      consumes:
      - multipart/form-data
      description: Upload logo image for an existing brand
      parameters:
      - description: Brand ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Logo image file
        in: formData
        name: logo
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: logo_path response
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Upload brand logo
      tags:
      - brands
  /brands/{slug}:
    get:
      description: Get brand details by its unique URL slug
      parameters:
      - description: Brand Slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/brand.Brand'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Get brand by slug
      tags:
      - brands
  /categories:
    get:
      description: Retrieve all categories in a hierarchical tree structure
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
